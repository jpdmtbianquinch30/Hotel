version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel_app
    restart: unless-stopped
    volumes:
      - ./:/var/www
    environment:
      - DB_CONNECTION=pgsql
      - DB_HOST=db
      - DB_PORT=5432
      - DB_DATABASE=hotel_db
      - DB_USERNAME=hotel_user
      - DB_PASSWORD=hotel_pass
    depends_on:
      - db
    networks:
      - hotel_network

  webserver:
    image: nginx:alpine
    container_name: hotel_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - hotel_network

  db:
    image: postgres:16-alpine
    container_name: hotel_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: hotel_db
      POSTGRES_USER: hotel_user
      POSTGRES_PASSWORD: hotel_pass
    ports:
      - "5433:5432"
    volumes:
      - hotel_pgdata:/var/lib/postgresql/data
    networks:
      - hotel_network

networks:
  hotel_network:
    driver: bridge

volumes:
  hotel_pgdata:
