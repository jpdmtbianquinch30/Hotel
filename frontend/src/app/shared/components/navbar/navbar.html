<header class="sticky top-0 z-50 bg-white border-b border-orange-100 shadow-sm">
  <div class="max-w-6xl mx-auto px-5 flex items-center justify-between h-16">
    <a routerLink="/" (click)="closeMenu()" class="flex items-center gap-2 font-extrabold text-xl text-ink-900">
      <span class="w-8 h-8 rounded-lg bg-orange-500 text-white flex items-center justify-center text-sm">GH</span>
      Galsen<span class="text-orange-500">Hotel</span>
    </a>

    <nav class="hidden md:flex items-center gap-2 text-sm">
      <a routerLink="/chambres" routerLinkActive="bg-orange-50 text-orange-600" title="Chambres" aria-label="Chambres"
        class="p-2.5 rounded-lg text-ink-700 hover:bg-orange-50 hover:text-orange-600 transition-colors">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
      </a>

      @if (auth.isAuthenticated()) {
        <a routerLink="/mes-reservations" routerLinkActive="bg-orange-50 text-orange-600" title="Mes réservations" aria-label="Mes réservations"
          class="p-2.5 rounded-lg text-ink-700 hover:bg-orange-50 hover:text-orange-600 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        </a>
        @if (auth.isAdmin()) {
          <a routerLink="/admin" routerLinkActive="bg-orange-50 text-orange-600" title="Administration" aria-label="Administration"
            class="p-2.5 rounded-lg text-ink-700 hover:bg-orange-50 hover:text-orange-600 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
          </a>
        }
        <a routerLink="/profil" routerLinkActive="bg-orange-50 text-orange-600" [title]="auth.currentUser()?.name ?? 'Mon profil'" aria-label="Mon profil"
          class="p-2.5 rounded-lg text-ink-700 hover:bg-orange-50 hover:text-orange-600 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </a>
        <button (click)="logout()" title="Déconnexion" aria-label="Déconnexion"
          class="p-2.5 rounded-lg text-orange-600 hover:bg-orange-50 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      } @else {
        <a routerLink="/connexion" routerLinkActive="bg-orange-50 text-orange-600" title="Connexion" aria-label="Connexion"
          class="p-2.5 rounded-lg text-ink-700 hover:bg-orange-50 hover:text-orange-600 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h11m-4 4v1a3 3 0 01-3 3H7a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </a>
        <a routerLink="/inscription" title="Créer un compte" aria-label="Créer un compte"
          class="p-2.5 rounded-lg bg-orange-500 text-white hover:bg-orange-600 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3M4 19v-1a4 4 0 014-4h2a4 4 0 014 4v1M11 7a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </a>
      }
    </nav>

    <button (click)="toggleMenu()" class="md:hidden p-2 text-ink-700" aria-label="Menu">
      <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>
  </div>

  @if (menuOpen) {
    <nav class="md:hidden flex items-center justify-around px-5 py-3 border-t border-orange-100">
      <a routerLink="/chambres" (click)="closeMenu()" aria-label="Chambres" class="p-2.5 text-ink-700">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
          <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
        </svg>
      </a>
      @if (auth.isAuthenticated()) {
        <a routerLink="/mes-reservations" (click)="closeMenu()" aria-label="Mes réservations" class="p-2.5 text-ink-700">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
          </svg>
        </a>
        @if (auth.isAdmin()) {
          <a routerLink="/admin" (click)="closeMenu()" aria-label="Administration" class="p-2.5 text-ink-700">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
            </svg>
          </a>
        }
        <a routerLink="/profil" (click)="closeMenu()" aria-label="Mon profil" class="p-2.5 text-ink-700">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
          </svg>
        </a>
        <button (click)="logout()" aria-label="Déconnexion" class="p-2.5 text-orange-600">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </button>
      } @else {
        <a routerLink="/connexion" (click)="closeMenu()" aria-label="Connexion" class="p-2.5 text-ink-700">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h11m-4 4v1a3 3 0 01-3 3H7a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
        </a>
        <a routerLink="/inscription" (click)="closeMenu()" aria-label="Créer un compte" class="p-2.5 text-orange-500">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3M4 19v-1a4 4 0 014-4h2a4 4 0 014 4v1M11 7a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
        </a>
      }
    </nav>
  }
</header>
