<section class="max-w-md mx-auto px-5 py-20">
  <div class="bg-white rounded-2xl p-8 border border-orange-100 shadow-sm">
    <p class="text-xs text-orange-600 font-semibold tracking-widest uppercase">GalsenHotel</p>
    <h1 class="text-3xl font-extrabold mt-2 mb-8 text-ink-900">Connexion</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
      <div>
        <label for="email" class="block text-sm mb-1.5 text-ink-700">Adresse e-mail</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          class="w-full rounded-lg bg-white border border-ink-300 px-3.5 py-2.5 text-ink-900 focus:border-orange-500 outline-none"
        />
        @if (form.controls.email.invalid && form.controls.email.touched) {
          <p class="text-red-600 text-xs mt-1">Adresse e-mail valide requise.</p>
        }
      </div>

      <div>
        <label for="password" class="block text-sm mb-1.5 text-ink-700">Mot de passe</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="w-full rounded-lg bg-white border border-ink-300 px-3.5 py-2.5 text-ink-900 focus:border-orange-500 outline-none"
        />
        @if (form.controls.password.invalid && form.controls.password.touched) {
          <p class="text-red-600 text-xs mt-1">Mot de passe requis.</p>
        }
      </div>

      @if (error()) {
        <p class="text-red-600 text-sm">{{ error() }}</p>
      }

      <button
        type="submit"
        [disabled]="loading()"
        class="w-full bg-orange-500 text-white font-semibold py-2.5 rounded-lg hover:bg-orange-600 transition-colors disabled:opacity-60"
      >
        {{ loading() ? 'Connexion en cours...' : 'Se connecter' }}
      </button>
    </form>

    <p class="text-sm text-ink-500 mt-6 text-center">
      Pas encore de compte ?
      <a routerLink="/inscription" class="text-orange-600 font-medium hover:underline">Inscrivez-vous</a>
    </p>
  </div>
</section>
